<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking de Películas</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0; background: #0b0f19; color: #e9eefc;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
    header {
      position: sticky; top: 0; background: #0b0f19; padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    h1 { font-size: 18px; margin: 0 0 6px; }
    .sub { opacity: .8; font-size: 12px; }
    .card {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; padding: 14px; margin-top: 12px;
    }
    .list { margin-top: 10px; display: grid; gap: 8px; }
    .row {
      display: flex; gap: 10px; align-items: center;
      padding: 10px 12px; border-radius: 12px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07);
    }
    .pos {
      width: 42px; height: 28px; display:flex; align-items:center; justify-content:center;
      border-radius: 10px; background: rgba(0,150,255,.18);
      border: 1px solid rgba(0,150,255,.35);
      font-weight: 700; font-size: 13px;
    }
    .title { flex: 1; font-weight: 600; word-break: break-word; }
    .small { font-size: 12px; opacity: .75; }
    .form { display: grid; gap: 10px; }
    label { font-size: 12px; opacity: .85; }
    input {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06); color: #e9eefc; outline: none;
    }
    input::placeholder { color: rgba(233,238,252,.55); }
    button {
      padding: 12px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 800;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: #06111f;
    }
    .btn-ghost {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #e9eefc;
      font-weight: 700;
    }
    .btn-danger {
      background: rgba(255,90,122,.18); border: 1px solid rgba(255,90,122,.35); color: #ff5a7a;
      font-weight: 800;
    }
    .msg { margin-top: 10px; font-size: 13px; min-height: 18px; opacity: .95; }
    .msg.ok { color: #3ef08a; }
    .msg.err { color: #ff5a7a; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎬 Ranking de Películas</h1>
      <div class="sub">Nube • Sincronizado en tiempo real • Celular y PC</div>
    </header>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <div>
          <div style="font-weight:800;">📜 Lista</div>
          <div class="small" id="countText">Cargando...</div>
        </div>
        <button class="btn-ghost" id="refreshBtn">🔄 Refrescar</button>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="card">
      <div style="font-weight:800;">✍️ Insertar / Cambiar puesto</div>
      <div class="form" style="margin-top:10px;">
        <div>
          <label for="title">Título de la película</label>
          <input id="title" placeholder="Ej: Interstellar" maxlength="120" />
        </div>

        <div>
          <label for="position">Puesto (número)</label>
          <input id="position" type="number" inputmode="numeric" placeholder="Ej: 1" />
        </div>

        <button id="saveBtn">✅ Publicar / Guardar</button>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:800;">❌ Borrar una película</div>
      <div class="form" style="margin-top:10px;">
        <div>
          <label for="deleteTitle">Nombre de la película a eliminar</label>
          <input id="deleteTitle" placeholder="Ej: Interstellar" maxlength="120" />
        </div>

        <button class="btn-danger" id="deleteSingleBtn">🗑️ Borrar película</button>
      </div>
    </div>

    <div class="card">
      <button class="btn-ghost" id="clearBtn" style="width:100%;" title="Borra TODO el ranking">🧨 Borrar todo el ranking</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getFirestore, collection, query, orderBy, onSnapshot,
      doc, getDocs, runTransaction, serverTimestamp, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDwAGFZ1dgR8Y7qmVAxz6E8ouni16r9aH4",
      authDomain: "ranking-36853.firebaseapp.com",
      projectId: "ranking-36853",
      storageBucket: "ranking-36853.firebasestorage.app",
      messagingSenderId: "879175318655",
      appId: "1:879175318655:web:86d5fdc1381e3995ec134a",
      measurementId: "G-7S8G70BV86"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const listEl = document.getElementById("list");
    const countText = document.getElementById("countText");
    const msgEl = document.getElementById("msg");

    const titleEl = document.getElementById("title");
    const positionEl = document.getElementById("position");
    const saveBtn = document.getElementById("saveBtn");
    
    const deleteTitleEl = document.getElementById("deleteTitle");
    const deleteSingleBtn = document.getElementById("deleteSingleBtn");
    
    const refreshBtn = document.getElementById("refreshBtn");
    const clearBtn = document.getElementById("clearBtn");

    let unsubscribe = null;

    function setMsg(text, type) {
      msgEl.textContent = text || "";
      msgEl.className = "msg" + (type ? " " + type : "");
    }

    function escapeHtml(str) {
      return (str ?? "").toString()
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render(items) {
      listEl.innerHTML = "";
      if (!items.length) {
        listEl.innerHTML = `<div class="small">Aún no hay películas. ¡Publica la primera! 🍿</div>`;
        return;
      }
      for (const it of items) {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <div class="pos">#${it.position}</div>
          <div class="title">${escapeHtml(it.title)}</div>
        `;
        listEl.appendChild(row);
      }
    }

    async function subscribeRanking() {
      const q = query(collection(db, "ranking"), orderBy("position", "asc"));
      if (unsubscribe) unsubscribe();

      unsubscribe = onSnapshot(q, (snap) => {
        const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        countText.textContent = `Total: ${items.length}`;
        render(items.sort((a,b)=>a.position-b.position));
      }, (error) => {
        console.error(error);
        setMsg("❌ Error al conectar con Firebase.", "err");
      });
    }

    refreshBtn.addEventListener("click", () => {
      setMsg("Actualizando…", "");
      subscribeRanking();
      setMsg("✅ Actualizado", "ok");
    });

    saveBtn.addEventListener("click", async () => {
      try {
        setMsg("", "");
        const title = (titleEl.value || "").trim();
        const position = Number(positionEl.value);

        if (!title) return setMsg("❌ Escribe un título.", "err");
        if (!Number.isFinite(position) || position < 1) return setMsg("❌ El puesto debe ser un número válido.", "err");

        await runTransaction(db, async (tx) => {
          const q = query(collection(db, "ranking"), orderBy("position", "asc"));
          const snap = await getDocs(q);

          const totalItems = snap.docs.length;
          let existingDocIdByTitle = null;

          for (const d of snap.docs) {
            const data = d.data();
            if (data?.title?.toLowerCase() === title.toLowerCase()) {
              existingDocIdByTitle = d.id;
              break;
            }
          }

          // Evitar huecos: si el puesto puesto es mayor al siguiente disponible, lo ajustamos al final consecutivo
          let maxAllowedPos = existingDocIdByTitle ? totalItems : totalItems + 1;
          let pos = Math.floor(position);
          if (pos > maxAllowedPos) {
            pos = maxAllowedPos;
          }

          const docsToShift = [];
          for (const d of snap.docs) {
            const data = d.data();
            if (d.id !== existingDocIdByTitle && typeof data?.position === "number" && data.position >= pos) {
              docsToShift.push({ id: d.id, position: data.position });
            }
          }

          docsToShift
            .sort((a,b)=>b.position-a.position)
            .forEach(({id, position}) => {
              const ref = doc(db, "ranking", id);
              tx.update(ref, { position: position + 1, updatedAt: serverTimestamp() });
            });

          if (existingDocIdByTitle) {
            const ref = doc(db, "ranking", existingDocIdByTitle);
            tx.update(ref, { position: pos, updatedAt: serverTimestamp(), title });
          } else {
            const newRef = doc(collection(db, "ranking"));
            tx.set(newRef, { title, position: pos, updatedAt: serverTimestamp() });
          }
        });

        setMsg("✅ Guardado en la nube.", "ok");
        titleEl.value = "";
        positionEl.value = "";
      } catch (e) {
        console.error(e);
        setMsg("❌ Error al guardar.", "err");
      }
    });

    deleteSingleBtn.addEventListener("click", async () => {
      const targetTitle = (deleteTitleEl.value || "").trim();
      if (!targetTitle) return setMsg("❌ Escribe el nombre de la película a eliminar.", "err");

      try {
        setMsg("Buscando y reordenando...", "");

        let foundTitle = "";
        let notFound = false;

        await runTransaction(db, async (tx) => {
          const q = query(collection(db, "ranking"), orderBy("position", "asc"));
          const snap = await getDocs(q);

          const targetDoc = snap.docs.find(d => d.data()?.title?.toLowerCase() === targetTitle.toLowerCase());

          if (!targetDoc) {
            notFound = true;
            return;
          }

          foundTitle = targetDoc.data().title;
          const removedPos = targetDoc.data().position;

          const targetRef = doc(db, "ranking", targetDoc.id);
          tx.delete(targetRef);

          snap.docs.forEach(d => {
            const data = d.data();
            if (d.id !== targetDoc.id && typeof data?.position === "number" && data.position > removedPos) {
              const ref = doc(db, "ranking", d.id);
              tx.update(ref, { position: data.position - 1, updatedAt: serverTimestamp() });
            }
          });
        });

        if (notFound) {
          return setMsg("❌ No se encontró ninguna película con ese nombre.", "err");
        }

        setMsg(`✅ Se eliminó "${foundTitle}" y se reordenó el ranking.`, "ok");
        deleteTitleEl.value = "";
      } catch (e) {
        console.error(e);
        setMsg("❌ Error al eliminar la película.", "err");
      }
    });

    clearBtn.addEventListener("click", async () => {
      const ok = confirm("¿Seguro que quieres borrar todo el ranking de la nube?");
      if (!ok) return;

      try {
        setMsg("🧨 Borrando…", "");
        const snap = await getDocs(collection(db, "ranking"));
        await Promise.all(snap.docs.map(d => deleteDoc(d.ref)));
        setMsg("✅ Borrado completo.", "ok");
      } catch (e) {
        console.error(e);
        setMsg("❌ No se pudo borrar.", "err");
      }
    });

    subscribeRanking();
  </script>
</body>
</html>
